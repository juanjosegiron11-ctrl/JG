<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de sesión de Melodías">
  <title>Iniciar sesión — Melodías</title>
  <link rel="stylesheet" href="estilo.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="pagina-login">
  <main class="contenedor-login">
    <section class="tarjeta-login" aria-labelledby="titulo-login">
      <div class="icono-musica" aria-hidden="true">♫</div>
      <p class="marca-login">MELODÍAS</p>
      <h1 id="titulo-login">Bienvenido</h1>
      <p class="texto-login">Inicia sesión para entrar a tu espacio musical.</p>

      <form id="formulario-login">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" placeholder="nombre@ejemplo.com" autocomplete="username" required>

        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>

        <button id="boton-login" type="submit">Iniciar sesión</button>
        <p id="mensaje-login" class="mensaje-login" role="alert" aria-live="polite"></p>
      </form>
      <p class="nota-login">Acceso para usuarios registrados.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
