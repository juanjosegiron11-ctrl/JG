<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10101b">
  <title>Iniciar sesión | Melodías</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="titulo-login">
      <div class="music-mark" aria-hidden="true">♫</div>
      <p class="eyebrow">TU ESPACIO MUSICAL</p>
      <h1 id="titulo-login">Bienvenido a Melodías</h1>
      <p class="intro">Inicia sesión para descubrir artistas y explorar música.</p>
      <form id="login-form">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" placeholder="Escribe tu usuario" required>
        <label for="contrasena">Contraseña</label>
        <input id="contrasena" name="contrasena" type="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required>
        <button id="login-button" type="submit">Iniciar sesión</button>
        <p id="mensaje" class="mensaje" role="alert" aria-live="polite"></p>
      </form>
      <p class="small-note">Acceso para usuarios previamente registrados.</p>
    </section>
  </main>
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
