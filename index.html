<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Melodías</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="music-mark">♫</div>
      <p class="eyebrow">TU ESPACIO MUSICAL</p>
      <h1>Bienvenido a Melodías</h1>
      <p class="intro">Inicia sesión para descubrir artistas y explorar música.</p>

      <form id="login-form">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required autocomplete="username">

        <label for="contrasena">Contraseña</label>
        <input type="password" id="contrasena" name="contrasena" required autocomplete="current-password">

        <button type="submit" id="btn-login">Iniciar sesión</button>
        <p class="mensaje" id="mensaje"></p>
      </form>

      <p class="small-note">Acceso para usuarios previamente registrados.</p>
    </div>
  </div>

  <!-- Librería oficial de Supabase -->
  <script src="https://jsdelivr.net"></script>
  <!-- Tus archivos de configuración y lógica -->
  <script src="supabase-config.js"></script>
  <script src="login.js"></script>
</body>
</html>
